.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:12px;text-decoration:none;border:1px solid #C5A880;color:#F4F4F0;transition:color .45s ease;z-index:0}

.offer{position:relative;text-decoration:none;color:#F4F4F0;overflow:hidden;z-index:0;transition:color .5s ease}
.offer::before{content:"";position:absolute;inset:0;background:rgba(197,168,128,.08);transform:scaleY(0);transform-origin:bottom;transition:transform .6s cubic-bezier(.2,.7,.2,1);z-index:-1}
.offer:hover::before{transform:scaleY(1)}
.offer .arr{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.offer:hover .arr{transform:translateX(10px)}
.offer .ttl{transition:color .5s ease}
.offer:hover .ttl{color:#C5A880}
.seal{transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter 1.2s ease;filter:drop-shadow(0 0 18px rgba(197,168,128,.25))}
.seal:hover{transform:translateY(-6px);filter:drop-shadow(0 0 30px rgba(197,168,128,.5))}
.tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFF7E6;box-shadow:0 0 8px 2px rgba(233,215,180,.7);animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
.sky{animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.04) translate(-8px,-4px)}}
.reg-star{transform-origin:center;animation:regTw 3.2s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,236,200,.9))}
.reg-star2{transform-origin:center;transform:rotate(45deg);animation:regTw2 3.2s ease-in-out infinite}
.reg-halo{animation:regHalo 3.2s ease-in-out infinite}
@keyframes regTw{0%,100%{opacity:.8;transform:scale(.82)}18%{opacity:1;transform:scale(1.18)}32%{opacity:.85;transform:scale(.95)}48%{opacity:1;transform:scale(1.3)}70%{opacity:.9;transform:scale(1)}}
@keyframes regTw2{0%,100%{opacity:.2;transform:rotate(45deg) scale(.7)}18%{opacity:.7;transform:rotate(45deg) scale(1.1)}48%{opacity:.9;transform:rotate(45deg) scale(1.25)}70%{opacity:.35;transform:rotate(45deg) scale(.9)}}
@keyframes regHalo{0%,100%{opacity:.55;transform:scale(.85)}48%{opacity:1;transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){.tw,.sky,.reg-star,.reg-star2,.reg-halo{animation:none}}
</style>
